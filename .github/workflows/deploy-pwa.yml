name: Deploy Hesabi PWA

on:
  push:
    branches: [master]
    paths:
      - "web-pwa/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-pwa/pnpm-lock.yaml
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        working-directory: web-pwa
        run: pnpm install --frozen-lockfile
      - name: Run domain tests
        working-directory: web-pwa
        run: pnpm test
      - name: Build static PWA for repository path
        working-directory: web-pwa
        run: pnpm vite build --base=/hesabi/
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-pwa/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
