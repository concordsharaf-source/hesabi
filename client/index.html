<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f7a57" />
    <meta name="description" content="حسابي: إدارة المنتجات والمخزون والمبيعات دون اتصال." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./hesabi-icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./hesabi-icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>حسابي | إدارة متجرك</title>
    <script>
      /* يطبّق السمة قبل أول رسم لمنع ومضة الخلفية الفاتحة عند تحديث الصفحة.
         الافتراضي "system": يتبع ضبط الجهاز حتى يختار المستخدم وضعًا صريحًا. */
      (function () {
        try {
          var stored = localStorage.getItem("hesabi-theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "dark" || stored === "light" ? stored : (prefersDark ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          if (theme === "dark") {
            document.documentElement.style.background = "#0d1211";
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#0d1211");
          }
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
